# Copy to ~/.dbt/profiles.yml (or set DBT_PROFILES_DIR to this folder and copy to
# profiles.yml, which is gitignored). Uses env vars only — no secrets in this file.
# Source your .env first:  set -a && source .env && set +a
nba_lakehouse:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'nba_dev') }}"
      schema: silver
      threads: 8
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: nba
      schema: silver
      threads: 8
