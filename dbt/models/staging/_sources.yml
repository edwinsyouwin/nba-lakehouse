version: 2

sources:
  - name: bronze
    database: "{{ env_var('DATABRICKS_CATALOG', 'nba_dev') }}"
    schema: bronze
    description: >
      Raw, as-ingested NBA Stats API result sets. One table per
      (endpoint, result_set); all source columns typed as STRING plus lineage
      columns. In Phase 1 these are populated via the SQL-warehouse sink; the
      target path is Auto Loader over the ops.landing volume.
    tables:
      - name: static_teams__Teams
        description: Static team reference data from nba_api.stats.static.teams.
      - name: commonallplayers__CommonAllPlayers
        description: Players active in a season (commonallplayers endpoint).
      - name: leaguegamelog__LeagueGameLog
        description: One row per team per game for a season (leaguegamelog endpoint).
      - name: boxscoretraditionalv3__PlayerStats
        description: Per-player traditional box score for a game (boxscoretraditionalv3).
      - name: boxscoreadvancedv3__PlayerStats
        description: Per-player advanced box score for a game (boxscoreadvancedv3).
      - name: playbyplayv3__PlayByPlay
        description: Per-event play-by-play for a game (carries shot coordinates).
      - name: playercareerstats__SeasonTotalsRegularSeason
        description: One row per player per season per team (playercareerstats).
      - name: commonteamroster__CommonTeamRoster
        description: One row per player per team-season — roster with jersey #, position, height/weight, college, age, experience (commonteamroster).
      - name: commonteamroster__Coaches
        description: >
          One row per coach/trainer per team-season — head coach, assistant
          coaches, and trainers (commonteamroster, Coaches result set). NBA Stats
          coverage is uneven across seasons; some team-seasons omit the head
          coach or return only trainers.
